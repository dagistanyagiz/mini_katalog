name: mini_katalog
description: "Flutter eğitim projesi - Mini Katalog Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

# Eğitim kuralı: ekstra paket kullanılmıyor, sadece Flutter SDK (material.dart)
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Asset yönetimi: ürün verileri JSON dosyasından okunuyor
  assets:
    - assets/products.json
